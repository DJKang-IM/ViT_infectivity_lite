# CXR Multi-task baseline B: Swin-Tiny @ 512x512
data:
  labels_csv: "artifacts/labels_cxr_mtl.csv"
  manifest_csv: "artifacts/cxr_image_manifest.csv"
  split_json: "artifacts/splits/study_split_70_15_15.json"

preprocess:
  image_size: 512
  clahe: true
  clahe_clip_limit: 0.03
  resize_mode: letterbox
  brightness_norm: true

model:
  backbone: swin_tiny          # swin_tiny_patch4_window7_224
  pretrained: true
  head_types: [reg, clf, reg, reg, clf]   # D1,D2,D3,D4,D5

train:
  seed: 42
  epochs: 30
  smoke_epochs: 1
  batch_size: 2
  accum_steps: 8               # effective batch 16
  lr: 1.0e-4
  weight_decay: 0.05
  warmup_epochs: 2
  amp: true
  patience: 6
  num_workers: 4

eval:
  binary_threshold: 0.5
  study_aggregation: mean
